function getYouTubeVideoId(url) {
  try {
    const urlObj = new URL(url);
    return urlObj.searchParams.get('v') || null;
  } catch {
    return null;
  }
}

    <article class="game-card gradient-border">
      <div class="bg-gray-900 rounded-[14px] overflow-hidden">
        <!-- Poster Image -->
        ${posterUrl ? `

          <img src="${posterUrl}" alt="${g.name}" loading="lazy" 
               class="absolute top-0 left-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
               onerror="console.error('Poster failed:', this.src); this.parentElement.style.background='linear-gradient(135deg, #6c5ce7, #a29bfe)';"/>

          <div class="absolute top-3 right-3 title-font text-2xl font-black bg-orange-500 text-white px-3 py-1 rounded-lg">#${g.rank}</div>

      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }},
      { get: () => config.accent_color || defaultConfig.accent_color, set: (v) => { config.accent_color = v; window.elementSdk.setConfig({ accent_color: v }); }},
      { get: () => config.button_color || defaultConfig.button_color, set: (v) => { config.button_color = v; window.elementSdk.setConfig({ button_color: v }); }}
    ],
    borderables: [],
    fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); }},

  }),
  mapToEditPanelValues: (config) => new Map([

});
